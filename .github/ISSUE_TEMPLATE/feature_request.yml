name: Feature request
description: Suggest an improvement for Anvil
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like Anvil to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — other approaches you tried or considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Anvil Agent / Chat
        - Local AI / Ollama
        - Packaging / install
        - Docs
        - Other
    validations:
      required: true
