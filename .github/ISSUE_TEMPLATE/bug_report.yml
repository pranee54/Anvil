name: Bug report
description: Report a problem with Anvil
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. **Remove secrets** from logs before pasting (API keys, tokens, paths to private repos).
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: anvil_version
    attributes:
      label: Anvil version
      description: e.g. 0.2.0 or git commit SHA
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: AI provider
      options:
        - ollama (local)
        - openai-compatible
        - anthropic
        - gemini
        - unknown / N/A
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: e.g. qwen2.5-coder:3b
      placeholder: qwen2.5-coder:3b
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (secrets removed)
      description: Paste relevant errors only. Strip API keys and personal paths.
