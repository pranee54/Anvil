name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build agent-core
        run: npm run build:agent

      - name: Build extension
        run: npm run build:extension

      - name: Typecheck agent
        run: npm run typecheck:agent

      - name: Typecheck extension
        run: npm run typecheck:extension

      - name: Test
        run: npm test
